name: MVX Restore Verify Offsite Archive

on:
  workflow_dispatch:
    inputs:
      restore_request_id:
        description: "MVX restore_requests.id to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mvx-restore-verify-${{ inputs.restore_request_id }}
  cancel-in-progress: false

jobs:
  verify-offsite:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEGA_SESSION: ${{ secrets.MEGA_SESSION }}
      MAIN_DB: housing-db
      MEGA_DESTINATION: /MVX-Backups
      WRANGLER_VERSION: 4.126.0

    steps:
      - name: Validate restore request input
        shell: bash
        env:
          RESTORE_REQUEST_ID: ${{ inputs.restore_request_id }}
        run: |
          set -euo pipefail

          if [[ ! "$RESTORE_REQUEST_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid restore_request_id." >&2
            exit 1
          fi

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates

          curl -fsSL \
            https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb \
            -o /tmp/megacmd.deb

          sudo apt-get install -y /tmp/megacmd.deb

          mega-version
          npx --yes wrangler@"$WRANGLER_VERSION" --version

      - name: Resolve protected restore request
        id: resolve
        shell: bash
        env:
          RESTORE_REQUEST_ID: ${{ inputs.restore_request_id }}
        run: |
          set -euo pipefail

          REQUEST_JSON="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --command "
                SELECT
                  rr.id,
                  rr.restore_type,
                  rr.status,
                  rr.requested_by,
                  rr.backup_run_id,
                  rr.archive_name,
                  rr.archive_sha256,
                  rr.expires_at,
                  br.status AS backup_status,
                  br.archive_name AS backup_archive_name,
                  br.archive_sha256 AS backup_archive_sha256,
                  br.main_integrity,
                  br.pii_integrity
                FROM restore_requests rr
                JOIN backup_runs br
                  ON br.id = rr.backup_run_id
                WHERE rr.id = $RESTORE_REQUEST_ID
                LIMIT 1;
              " \
              --json
          )"

          RESOLVED="$(
            printf '%s' "$REQUEST_JSON" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const root = Array.isArray(data) ? data[0] : data;
                const row =
                  root?.results?.[0] ??
                  root?.result?.[0]?.results?.[0] ??
                  null;

                if (!row) {
                  console.error("Restore request not found.");
                  process.exit(2);
                }

                const requestId = Number(row.id);
                const requestedBy = Number(row.requested_by);
                const backupRunId = Number(row.backup_run_id);
                const archiveName = String(row.archive_name || "");
                const archiveSha256 = String(row.archive_sha256 || "");
                const expiresAt = String(row.expires_at || "");

                if (!Number.isInteger(requestId) || requestId <= 0) {
                  console.error("Invalid restore request id in database.");
                  process.exit(2);
                }

                if (!Number.isInteger(requestedBy) || requestedBy <= 0) {
                  console.error("Invalid restore request owner.");
                  process.exit(2);
                }

                if (!Number.isInteger(backupRunId) || backupRunId <= 0) {
                  console.error("Invalid backup_run_id.");
                  process.exit(2);
                }

                if (row.restore_type !== "offsite_backup") {
                  console.error("Restore request is not offsite_backup.");
                  process.exit(2);
                }

                if (row.status !== "pending") {
                  console.error("Restore request is not pending.");
                  process.exit(2);
                }

                const expiresMs = Date.parse(expiresAt);

                if (!Number.isFinite(expiresMs) || expiresMs <= Date.now()) {
                  console.error("Restore request has expired.");
                  process.exit(2);
                }

                if (row.backup_status !== "success") {
                  console.error("Referenced backup is not successful.");
                  process.exit(2);
                }

                if (
                  row.main_integrity !== "ok" ||
                  row.pii_integrity !== "ok"
                ) {
                  console.error("Referenced backup integrity is not verified.");
                  process.exit(2);
                }

                if (
                  archiveName !== String(row.backup_archive_name || "") ||
                  archiveSha256 !== String(row.backup_archive_sha256 || "")
                ) {
                  console.error("Restore request metadata no longer matches backup metadata.");
                  process.exit(2);
                }

                if (!/^backup-[0-9]{8}-[0-9]{6}\.tar\.gz\.enc$/.test(archiveName)) {
                  console.error("Unexpected archive name format.");
                  process.exit(2);
                }

                if (!/^[0-9a-f]{64}$/.test(archiveSha256)) {
                  console.error("Unexpected archive SHA-256 format.");
                  process.exit(2);
                }

                process.stdout.write(JSON.stringify({
                  request_id: requestId,
                  requested_by: requestedBy,
                  backup_run_id: backupRunId,
                  archive_name: archiveName,
                  archive_sha256: archiveSha256
                }));
              });
            '
          )"

          REQUESTED_BY="$(
            printf '%s' "$RESOLVED" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).requested_by'
          )"

          BACKUP_RUN_ID="$(
            printf '%s' "$RESOLVED" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).backup_run_id'
          )"

          ARCHIVE_NAME="$(
            printf '%s' "$RESOLVED" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).archive_name'
          )"

          ARCHIVE_SHA256="$(
            printf '%s' "$RESOLVED" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).archive_sha256'
          )"

          echo "requested_by=$REQUESTED_BY" >> "$GITHUB_OUTPUT"
          echo "backup_run_id=$BACKUP_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"

          echo "Protected restore request validated."
          echo "Backup run: $BACKUP_RUN_ID"
          echo "Archive: $ARCHIVE_NAME"

      - name: Create offsite verification record
        id: check
        shell: bash
        env:
          RESTORE_REQUEST_ID: ${{ inputs.restore_request_id }}
          REQUESTED_BY: ${{ steps.resolve.outputs.requested_by }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.resolve.outputs.archive_sha256 }}
        run: |
          set -euo pipefail

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          INSERT_JSON="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --command "
                INSERT INTO restore_offsite_checks (
                  restore_request_id,
                  status,
                  github_run_id,
                  archive_name,
                  expected_sha256,
                  checked_provider,
                  checked_destination,
                  requested_by,
                  started_at,
                  created_at,
                  updated_at
                )
                VALUES (
                  $RESTORE_REQUEST_ID,
                  'running',
                  '$GITHUB_RUN_ID',
                  '$ARCHIVE_NAME',
                  '$ARCHIVE_SHA256',
                  'MEGA',
                  '$MEGA_DESTINATION',
                  $REQUESTED_BY,
                  '$NOW_ISO',
                  '$NOW_ISO',
                  '$NOW_ISO'
                )
                RETURNING id;
              " \
              --json
          )"

          CHECK_ID="$(
            printf '%s' "$INSERT_JSON" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const root = Array.isArray(data) ? data[0] : data;
                const row =
                  root?.results?.[0] ??
                  root?.result?.[0]?.results?.[0] ??
                  null;

                const id = Number(row?.id);

                if (!Number.isInteger(id) || id <= 0) {
                  console.error("restore_offsite_checks id not returned");
                  process.exit(2);
                }

                process.stdout.write(String(id));
              });
            '
          )"

          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "Offsite verification record created: $CHECK_ID"

      - name: Verify archive presence in MEGA
        id: mega
        shell: bash
        env:
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive_name }}
        run: |
          set -euo pipefail

          mega-login "$MEGA_SESSION"

          echo "Checking exact archive path in MEGA..."
          echo "Provider: MEGA"
          echo "Destination: $MEGA_DESTINATION"
          echo "Archive: $ARCHIVE_NAME"

          if mega-ls -l "$MEGA_DESTINATION/$ARCHIVE_NAME" > /tmp/mega-restore-check.txt 2>&1; then
            cat /tmp/mega-restore-check.txt

            echo "Archive is present in MEGA."
            echo "presence=present" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/mega-restore-check.txt || true

            NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --command "
                UPDATE restore_offsite_checks
                SET
                  status = 'missing',
                  failure_code = 'MEGA_ARCHIVE_NOT_FOUND',
                  completed_at = '$NOW_ISO',
                  updated_at = '$NOW_ISO'
                WHERE id = $CHECK_ID
                  AND status = 'running';
              "

            echo "Archive is not present at the expected MEGA path." >&2
            exit 1
          fi

      - name: Download encrypted archive to temporary runner storage
        id: download
        shell: bash
        env:
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive_name }}
        run: |
          set -euo pipefail
          umask 077

          DOWNLOAD_DIR="$RUNNER_TEMP/mvx-restore-verify-$GITHUB_RUN_ID"
          ARCHIVE_PATH="$DOWNLOAD_DIR/$ARCHIVE_NAME"

          mkdir -p "$DOWNLOAD_DIR"

          echo "Downloading encrypted archive to temporary runner storage..."

          mega-get \
            "$MEGA_DESTINATION/$ARCHIVE_NAME" \
            "$DOWNLOAD_DIR/"

          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "Downloaded archive not found at expected local path." >&2
            exit 1
          fi

          if [ ! -s "$ARCHIVE_PATH" ]; then
            echo "Downloaded archive is empty." >&2
            exit 1
          fi

          ARCHIVE_SIZE="$(
            stat -c '%s' "$ARCHIVE_PATH"
          )"

          DOWNLOADED_AT="$(
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          )"

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "archive_size_bytes=$ARCHIVE_SIZE" >> "$GITHUB_OUTPUT"
          echo "downloaded_at=$DOWNLOADED_AT" >> "$GITHUB_OUTPUT"

          echo "Encrypted archive downloaded."
          echo "Downloaded size: $ARCHIVE_SIZE bytes"

      - name: Verify downloaded archive SHA-256
        id: sha
        shell: bash
        env:
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          ARCHIVE_PATH: ${{ steps.download.outputs.archive_path }}
          ARCHIVE_SIZE_BYTES: ${{ steps.download.outputs.archive_size_bytes }}
          DOWNLOADED_AT: ${{ steps.download.outputs.downloaded_at }}
          EXPECTED_SHA256: ${{ steps.resolve.outputs.archive_sha256 }}
        run: |
          set -euo pipefail

          if [ -z "${ARCHIVE_PATH:-}" ] || [ ! -f "$ARCHIVE_PATH" ]; then
            echo "Temporary archive path is unavailable." >&2
            exit 1
          fi

          if [[ ! "$ARCHIVE_SIZE_BYTES" =~ ^[0-9]+$ ]]; then
            echo "Invalid downloaded archive size." >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid expected SHA-256." >&2
            exit 1
          fi

          ACTUAL_SHA256="$(
            sha256sum "$ARCHIVE_PATH" | awk '{print $1}'
          )"

          NOW_ISO="$(
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          )"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --command "
                UPDATE restore_offsite_checks
                SET
                  status = 'failed',
                  downloaded_size_bytes = $ARCHIVE_SIZE_BYTES,
                  actual_sha256 = '$ACTUAL_SHA256',
                  sha256_verified = 0,
                  downloaded_at = '$DOWNLOADED_AT',
                  failure_code = 'SHA256_MISMATCH',
                  completed_at = '$NOW_ISO',
                  updated_at = '$NOW_ISO'
                WHERE id = $CHECK_ID
                  AND status = 'running';
              "

            echo "Downloaded archive SHA-256 does not match expected value." >&2
            exit 1
          fi

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
            --remote \
            --command "
              UPDATE restore_offsite_checks
              SET
                status = 'present',
                downloaded_size_bytes = $ARCHIVE_SIZE_BYTES,
                actual_sha256 = '$ACTUAL_SHA256',
                sha256_verified = 1,
                downloaded_at = '$DOWNLOADED_AT',
                failure_code = NULL,
                completed_at = '$NOW_ISO',
                updated_at = '$NOW_ISO'
              WHERE id = $CHECK_ID
                AND status = 'running';
            "

          echo "Archive SHA-256 verified successfully."
          echo "sha256_verified=true" >> "$GITHUB_OUTPUT"

      - name: Remove temporary downloaded archive
        if: always()
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.download.outputs.archive_path }}
        run: |
          set -euo pipefail

          if [ -n "${ARCHIVE_PATH:-}" ] && [ -f "$ARCHIVE_PATH" ]; then
            rm -f "$ARCHIVE_PATH"
          fi

          DOWNLOAD_DIR="$RUNNER_TEMP/mvx-restore-verify-$GITHUB_RUN_ID"

          if [ -d "$DOWNLOAD_DIR" ]; then
            rm -rf "$DOWNLOAD_DIR"
          fi

          echo "Temporary restore-verification files removed."

      - name: Mark unfinished verification as failed
        if: failure() && steps.check.outputs.check_id != ''
        shell: bash
        env:
          CHECK_ID: ${{ steps.check.outputs.check_id }}
        run: |
          set -euo pipefail

          if [[ ! "$CHECK_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid check id; failure status cannot be recorded." >&2
            exit 1
          fi

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
            --remote \
            --command "
              UPDATE restore_offsite_checks
              SET
                status = 'failed',
                failure_code = COALESCE(
                  failure_code,
                  'RESTORE_VERIFY_WORKFLOW_FAILED'
                ),
                completed_at = COALESCE(
                  completed_at,
                  '$NOW_ISO'
                ),
                updated_at = '$NOW_ISO'
              WHERE id = $CHECK_ID
                AND status = 'running';
            "

      - name: Summary
        if: always()
        shell: bash
        env:
          RESTORE_REQUEST_ID: ${{ inputs.restore_request_id }}
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive_name }}
          PRESENCE: ${{ steps.mega.outputs.presence }}
        run: |
          {
            echo "## MVX Restore Offsite Verification"
            echo
            echo "- Restore request: $RESTORE_REQUEST_ID"
            echo "- Check record: ${CHECK_ID:-not-created}"
            echo "- Provider: MEGA"
            echo "- Destination: $MEGA_DESTINATION"
            echo "- Archive: ${ARCHIVE_NAME:-not-resolved}"
            echo "- Presence: ${PRESENCE:-not-confirmed}"
            echo "- Download performed: yes, temporary runner storage only"
            echo "- SHA-256 verified: ${{ steps.sha.outputs.sha256_verified || 'false' }}"
            echo "- Temporary archive retained: no"
            echo "- Decryption performed: no"
            echo "- Restore performed: no"
          } >> "$GITHUB_STEP_SUMMARY"
