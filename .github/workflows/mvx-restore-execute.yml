name: MVX Restore Execution Preflight

on:
  workflow_dispatch:
    inputs:
      restore_execution_id:
        description: "Restore execution journal ID"
        required: true
        type: string
      control_plane_only:
        description: "Must remain true in SR14F-D5B-2B"
        required: true
        default: "true"
        type: string

permissions:
  contents: read

concurrency:
  group: mvx-restore-execution-${{ inputs.restore_execution_id }}
  cancel-in-progress: false

jobs:
  verify-dispatch:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAIN_DB: housing-db
      OPS_DB: housing-ops-db
      MAIN_D1_DATABASE_ID: ebf27bcc-9980-4564-afe9-db14e444220f
      PII_D1_DATABASE_ID: 5f20d702-446a-4a22-9d91-7ecbdc931bd0
      WRANGLER_VERSION: "4.127.0"

    steps:
      - name: Validate control-plane inputs
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "${{ inputs.restore_execution_id }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid restore_execution_id." >&2
            exit 2
          fi

          if [ "${{ inputs.control_plane_only }}" != "true" ]; then
            echo "SR14F-D5B-2B requires control_plane_only=true." >&2
            exit 2
          fi

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" --version

      - name: Resolve execution journal
        id: execution
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --json \
              --command "
                SELECT
                  re.id,
                  re.status,
                  re.github_run_id,
                  re.archive_name,
                  re.target_timestamp,
                  arm.status AS arm_status,
                  rr.status AS readiness_status
                FROM restore_executions re
                JOIN restore_execution_arms arm
                  ON arm.id = re.execution_arm_id
                JOIN restore_readiness rr
                  ON rr.id = re.readiness_id
                WHERE re.id = $EXECUTION_ID
                LIMIT 1;
              "
          )"

          ROW="$(
            printf '%s' "$RAW" | jq -c '
              if type == "array" then
                .[0].results[0] // empty
              else
                .results[0] // empty
              end
            '
          )"

          if [ -z "$ROW" ]; then
            echo "Restore execution record not found." >&2
            exit 3
          fi

          STATUS="$(printf '%s' "$ROW" | jq -r '.status // ""')"
          ARM_STATUS="$(printf '%s' "$ROW" | jq -r '.arm_status // ""')"
          READINESS_STATUS="$(printf '%s' "$ROW" | jq -r '.readiness_status // ""')"
          CONTROL_PLANE_RUN_ID="$(printf '%s' "$ROW" | jq -r '.github_run_id // ""')"

          if [ "$STATUS" != "requested" ]; then
            echo "Execution is not in requested state: $STATUS" >&2
            exit 4
          fi

          if [ "$ARM_STATUS" != "consumed" ]; then
            echo "Execution arm is not consumed: $ARM_STATUS" >&2
            exit 4
          fi

          if [ "$READINESS_STATUS" != "ready" ]; then
            echo "Readiness is not ready: $READINESS_STATUS" >&2
            exit 4
          fi

          if [ -z "$CONTROL_PLANE_RUN_ID" ]; then
            echo "Control-plane GitHub run ID is missing from execution journal." >&2
            exit 4
          fi

          echo "control_plane_run_id=$CONTROL_PLANE_RUN_ID" >> "$GITHUB_OUTPUT"

          echo "archive_name=$(printf '%s' "$ROW" | jq -r '.archive_name // ""')" >> "$GITHUB_OUTPUT"
          echo "target_timestamp=$(printf '%s' "$ROW" | jq -r '.target_timestamp // ""')" >> "$GITHUB_OUTPUT"

      - name: Mirror execution journal to OPS DB
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --json \
              --command "
                SELECT
                  id,
                  restore_request_id,
                  readiness_id,
                  execution_arm_id,
                  backup_run_id,
                  archive_name,
                  archive_sha256,
                  target_timestamp,
                  main_pre_restore_bookmark,
                  pii_pre_restore_bookmark
                FROM restore_executions
                WHERE id = $EXECUTION_ID
                LIMIT 1;
              "
          )"

          ROW="$(
            printf '%s' "$RAW" | jq -c '
              if type == "array" then
                .[0].results[0] // empty
              else
                .results[0] // empty
              end
            '
          )"

          if [ -z "$ROW" ]; then
            echo "Restore execution row not found for OPS mirror." >&2
            exit 5
          fi

          RESTORE_REQUEST_ID="$(printf '%s' "$ROW" | jq -r '.restore_request_id')"
          READINESS_ID="$(printf '%s' "$ROW" | jq -r '.readiness_id')"
          EXECUTION_ARM_ID="$(printf '%s' "$ROW" | jq -r '.execution_arm_id')"
          BACKUP_RUN_ID="$(printf '%s' "$ROW" | jq -r '.backup_run_id')"
          ARCHIVE_NAME="$(printf '%s' "$ROW" | jq -r '.archive_name')"
          ARCHIVE_SHA256="$(printf '%s' "$ROW" | jq -r '.archive_sha256')"
          TARGET_TIMESTAMP="$(printf '%s' "$ROW" | jq -r '.target_timestamp')"
          MAIN_PRE_BOOKMARK="$(printf '%s' "$ROW" | jq -r '.main_pre_restore_bookmark')"
          PII_PRE_BOOKMARK="$(printf '%s' "$ROW" | jq -r '.pii_pre_restore_bookmark')"
          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          # Escape single quotes for SQLite string literals.
          sql_escape() {
            printf "%s" "$1" | sed "s/'/''/g"
          }

          ARCHIVE_NAME_SQL="$(sql_escape "$ARCHIVE_NAME")"
          ARCHIVE_SHA256_SQL="$(sql_escape "$ARCHIVE_SHA256")"
          TARGET_TIMESTAMP_SQL="$(sql_escape "$TARGET_TIMESTAMP")"
          MAIN_PRE_SQL="$(sql_escape "$MAIN_PRE_BOOKMARK")"
          PII_PRE_SQL="$(sql_escape "$PII_PRE_BOOKMARK")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              INSERT INTO restore_execution_journal (
                restore_execution_id,
                restore_request_id,
                readiness_id,
                execution_arm_id,
                backup_run_id,
                archive_name,
                archive_sha256,
                target_timestamp,
                main_pre_restore_bookmark,
                pii_pre_restore_bookmark,
                status,
                github_run_id,
                created_at,
                updated_at
              )
              VALUES (
                $EXECUTION_ID,
                $RESTORE_REQUEST_ID,
                $READINESS_ID,
                $EXECUTION_ARM_ID,
                $BACKUP_RUN_ID,
                '$ARCHIVE_NAME_SQL',
                '$ARCHIVE_SHA256_SQL',
                '$TARGET_TIMESTAMP_SQL',
                '$MAIN_PRE_SQL',
                '$PII_PRE_SQL',
                'preflight',
                '$GITHUB_RUN_ID',
                '$NOW_ISO',
                '$NOW_ISO'
              )
              ON CONFLICT(restore_execution_id) DO UPDATE SET
                github_run_id = excluded.github_run_id,
                updated_at = excluded.updated_at;
            "

      - name: Resolve current and target D1 bookmarks
        id: bookmarks
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          TARGET_TIMESTAMP="${{ steps.execution.outputs.target_timestamp }}"

          if [ -z "$TARGET_TIMESTAMP" ]; then
            echo "Target timestamp is empty." >&2
            exit 6
          fi

          api_get_bookmark() {
            local db_id="$1"
            local timestamp="${2:-}"
            local url

            url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${db_id}/time_travel/bookmark"

            if [ -n "$timestamp" ]; then
              url="${url}?timestamp=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$timestamp")"
            fi

            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$url"
          }

          MAIN_CURRENT_JSON="$(api_get_bookmark "$MAIN_D1_DATABASE_ID")"
          PII_CURRENT_JSON="$(api_get_bookmark "$PII_D1_DATABASE_ID")"
          MAIN_TARGET_JSON="$(api_get_bookmark "$MAIN_D1_DATABASE_ID" "$TARGET_TIMESTAMP")"
          PII_TARGET_JSON="$(api_get_bookmark "$PII_D1_DATABASE_ID" "$TARGET_TIMESTAMP")"

          for label in MAIN_CURRENT PII_CURRENT MAIN_TARGET PII_TARGET; do
            var_name="${label}_JSON"
            payload="${!var_name}"

            if [ "$(printf '%s' "$payload" | jq -r '.success // false')" != "true" ]; then
              echo "$label bookmark lookup failed." >&2
              printf '%s\n' "$payload" | jq '{success, errors, messages}' >&2
              exit 7
            fi
          done

          MAIN_CURRENT_BOOKMARK="$(printf '%s' "$MAIN_CURRENT_JSON" | jq -r '.result.bookmark // empty')"
          PII_CURRENT_BOOKMARK="$(printf '%s' "$PII_CURRENT_JSON" | jq -r '.result.bookmark // empty')"
          MAIN_TARGET_BOOKMARK="$(printf '%s' "$MAIN_TARGET_JSON" | jq -r '.result.bookmark // empty')"
          PII_TARGET_BOOKMARK="$(printf '%s' "$PII_TARGET_JSON" | jq -r '.result.bookmark // empty')"

          if [ -z "$MAIN_CURRENT_BOOKMARK" ] || \
             [ -z "$PII_CURRENT_BOOKMARK" ] || \
             [ -z "$MAIN_TARGET_BOOKMARK" ] || \
             [ -z "$PII_TARGET_BOOKMARK" ]; then
            echo "One or more D1 bookmarks are empty." >&2
            exit 8
          fi

          echo "main_current_bookmark=$MAIN_CURRENT_BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "pii_current_bookmark=$PII_CURRENT_BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "main_target_bookmark=$MAIN_TARGET_BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "pii_target_bookmark=$PII_TARGET_BOOKMARK" >> "$GITHUB_OUTPUT"

      - name: Persist preflight bookmarks to OPS and Main journals
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          MAIN_CURRENT="${{ steps.bookmarks.outputs.main_current_bookmark }}"
          PII_CURRENT="${{ steps.bookmarks.outputs.pii_current_bookmark }}"
          MAIN_TARGET="${{ steps.bookmarks.outputs.main_target_bookmark }}"
          PII_TARGET="${{ steps.bookmarks.outputs.pii_target_bookmark }}"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                main_pre_restore_bookmark = '$MAIN_CURRENT',
                pii_pre_restore_bookmark = '$PII_CURRENT',
                main_target_bookmark = '$MAIN_TARGET',
                pii_target_bookmark = '$PII_TARGET',
                status = 'ready',
                preflight_status = 'ready',
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID;
            "

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
            --remote \
            --command "
              UPDATE restore_executions
              SET
                main_pre_restore_bookmark = '$MAIN_CURRENT',
                pii_pre_restore_bookmark = '$PII_CURRENT',
                main_target_bookmark = '$MAIN_TARGET',
                pii_target_bookmark = '$PII_TARGET',
                preflight_status = 'ready',
                preflight_checked_at = '$NOW_ISO',
                updated_at = '$NOW_ISO'
              WHERE id = $EXECUTION_ID;
            "

      - name: Confirm destructive restore remains disabled
        shell: bash
        run: |
          set -euo pipefail

          echo "D5B-2C preflight completed."
          echo "Current and target bookmarks were resolved and journaled."
          echo "No D1 Time Travel restore call was performed."
          echo "No production SQL import was performed."
          echo "No R2 mutation was performed."

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MVX Restore Execution Preflight"
            echo
            echo "- Restore execution: ${{ inputs.restore_execution_id }}"
            echo "- Preflight GitHub run ID: $GITHUB_RUN_ID"
            echo "- Control-plane GitHub run ID: ${{ steps.execution.outputs.control_plane_run_id || 'not-resolved' }}"
            echo "- Archive: ${{ steps.execution.outputs.archive_name || 'not-resolved' }}"
            echo "- Target timestamp: ${{ steps.execution.outputs.target_timestamp || 'not-resolved' }}"
            echo "- OPS journal mirror: prepared with preflight run ID"
            echo "- Main current bookmark resolved: ${{ steps.bookmarks.outputs.main_current_bookmark && 'yes' || 'no' }}"
            echo "- PII current bookmark resolved: ${{ steps.bookmarks.outputs.pii_current_bookmark && 'yes' || 'no' }}"
            echo "- Main target bookmark resolved: ${{ steps.bookmarks.outputs.main_target_bookmark && 'yes' || 'no' }}"
            echo "- PII target bookmark resolved: ${{ steps.bookmarks.outputs.pii_target_bookmark && 'yes' || 'no' }}"
            echo "- Preflight status: ${{ steps.bookmarks.outcome == 'success' && 'ready' || 'not-ready' }}"
            echo "- Destructive D1 restore performed: no"
            echo "- Production SQL import performed: no"
            echo "- R2 mutation performed: no"
          } >> "$GITHUB_STEP_SUMMARY"
