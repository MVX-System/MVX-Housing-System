name: MVX Actual Controlled D1 Restore

on:
  workflow_dispatch:
    inputs:
      restore_execution_id:
        description: "OPS restore execution journal ID"
        required: true
        type: string
      confirmation_phrase:
        description: "Exact phrase: RESTORE PRODUCTION EXECUTION <id>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mvx-actual-production-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      MAIN_DB: housing-db
      PII_DB: housing-pii-db
      OPS_DB: housing-ops-db

      MAIN_D1_DATABASE_ID: ebf27bcc-9980-4564-afe9-db14e444220f
      PII_D1_DATABASE_ID: 5f20d702-446a-4a22-9d91-7ecbdc931bd0

      WRANGLER_VERSION: "4.127.0"

    steps:
      - name: Validate explicit destructive confirmation
        id: confirm
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          RAW_CONFIRMATION="${{ inputs.confirmation_phrase }}"

          if ! [[ "$EXECUTION_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid restore_execution_id." >&2
            exit 2
          fi

          EXPECTED="RESTORE PRODUCTION EXECUTION ${EXECUTION_ID}"

          # GitHub text inputs can accidentally contain surrounding spaces
          # when pasted. Normalize only surrounding whitespace; the actual
          # phrase, capitalization and execution ID must still match exactly.
          CONFIRMATION="$(
            printf '%s' "$RAW_CONFIRMATION" |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          )"

          if [ "$CONFIRMATION" != "$EXPECTED" ]; then
            echo "Confirmation phrase mismatch." >&2
            echo "Required phrase: $EXPECTED" >&2
            exit 2
          fi

          echo "confirmed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" --version

      - name: Resolve independent OPS restore journal
        id: journal
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
              --remote \
              --json \
              --command "
                SELECT
                  id,
                  restore_execution_id,
                  restore_request_id,
                  readiness_id,
                  execution_arm_id,
                  backup_run_id,
                  archive_name,
                  archive_sha256,
                  target_timestamp,
                  main_pre_restore_bookmark,
                  pii_pre_restore_bookmark,
                  main_target_bookmark,
                  pii_target_bookmark,
                  status,
                  preflight_status,
                  rollback_status,
                  restore_github_run_id,
                  failure_code
                FROM restore_execution_journal
                WHERE restore_execution_id = $EXECUTION_ID
                LIMIT 1;
              "
          )"

          ROW="$(
            printf '%s' "$RAW" | jq -c '
              if type == "array" then
                .[0].results[0] // empty
              else
                .results[0] // empty
              end
            '
          )"

          if [ -z "$ROW" ]; then
            echo "OPS restore journal entry not found." >&2
            exit 3
          fi

          STATUS="$(printf '%s' "$ROW" | jq -r '.status // ""')"
          PREFLIGHT_STATUS="$(printf '%s' "$ROW" | jq -r '.preflight_status // ""')"
          FAILURE_CODE="$(printf '%s' "$ROW" | jq -r '.failure_code // ""')"
          EXISTING_RESTORE_RUN="$(printf '%s' "$ROW" | jq -r '.restore_github_run_id // ""')"

          if [ "$STATUS" != "ready" ]; then
            echo "OPS journal is not ready: $STATUS" >&2
            exit 4
          fi

          if [ "$PREFLIGHT_STATUS" != "ready" ]; then
            echo "Preflight is not ready: $PREFLIGHT_STATUS" >&2
            exit 4
          fi

          if [ -n "$FAILURE_CODE" ]; then
            echo "OPS journal contains failure_code: $FAILURE_CODE" >&2
            exit 4
          fi

          if [ -n "$EXISTING_RESTORE_RUN" ]; then
            echo "Actual restore run is already recorded: $EXISTING_RESTORE_RUN" >&2
            exit 4
          fi

          MAIN_TARGET="$(printf '%s' "$ROW" | jq -r '.main_target_bookmark // ""')"
          PII_TARGET="$(printf '%s' "$ROW" | jq -r '.pii_target_bookmark // ""')"
          TARGET_TIMESTAMP="$(printf '%s' "$ROW" | jq -r '.target_timestamp // ""')"
          ARCHIVE_NAME="$(printf '%s' "$ROW" | jq -r '.archive_name // ""')"

          if [ -z "$MAIN_TARGET" ] || [ -z "$PII_TARGET" ]; then
            echo "Target bookmarks are missing." >&2
            exit 4
          fi

          echo "main_target_bookmark=$MAIN_TARGET" >> "$GITHUB_OUTPUT"
          echo "pii_target_bookmark=$PII_TARGET" >> "$GITHUB_OUTPUT"
          echo "target_timestamp=$TARGET_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Claim actual restore run in OPS journal
        id: claim
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                restore_github_run_id = '$GITHUB_RUN_ID',
                status = 'running',
                rollback_status = 'not_required',
                failure_code = NULL,
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID
                AND status = 'ready'
                AND preflight_status = 'ready'
                AND restore_github_run_id IS NULL;
            "

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
              --remote \
              --json \
              --command "
                SELECT
                  status,
                  restore_github_run_id
                FROM restore_execution_journal
                WHERE restore_execution_id = $EXECUTION_ID
                LIMIT 1;
              "
          )"

          ROW="$(
            printf '%s' "$RAW" | jq -c '
              if type == "array" then
                .[0].results[0] // empty
              else
                .results[0] // empty
              end
            '
          )"

          STATUS="$(printf '%s' "$ROW" | jq -r '.status // ""')"
          RUN_ID="$(printf '%s' "$ROW" | jq -r '.restore_github_run_id // ""')"

          if [ "$STATUS" != "running" ] || [ "$RUN_ID" != "$GITHUB_RUN_ID" ]; then
            echo "Could not exclusively claim actual restore execution." >&2
            exit 5
          fi

      - name: Enable independent maintenance lock
        id: maintenance
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE system_operations_control
              SET
                maintenance_enabled = 1,
                maintenance_reason = 'controlled_restore',
                restore_execution_id = $EXECUTION_ID,
                enabled_at = '$NOW_ISO',
                disabled_at = NULL,
                updated_at = '$NOW_ISO'
              WHERE id = 1
                AND maintenance_enabled = 0;
            "

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
              --remote \
              --json \
              --command "
                SELECT
                  maintenance_enabled,
                  restore_execution_id
                FROM system_operations_control
                WHERE id = 1
                LIMIT 1;
              "
          )"

          ROW="$(
            printf '%s' "$RAW" | jq -c '
              if type == "array" then
                .[0].results[0] // empty
              else
                .results[0] // empty
              end
            '
          )"

          ENABLED="$(printf '%s' "$ROW" | jq -r '.maintenance_enabled // 0')"
          ACTIVE_ID="$(printf '%s' "$ROW" | jq -r '.restore_execution_id // ""')"

          if [ "$ENABLED" != "1" ] || [ "$ACTIVE_ID" != "$EXECUTION_ID" ]; then
            echo "Maintenance lock was not acquired." >&2
            exit 6
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Capture final pre-restore bookmarks
        id: current
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"

          get_current_bookmark() {
            local db_id="$1"

            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${db_id}/time_travel/bookmark"
          }

          MAIN_JSON="$(get_current_bookmark "$MAIN_D1_DATABASE_ID")"
          PII_JSON="$(get_current_bookmark "$PII_D1_DATABASE_ID")"

          if [ "$(printf '%s' "$MAIN_JSON" | jq -r '.success // false')" != "true" ]; then
            echo "Failed to obtain final Main pre-restore bookmark." >&2
            exit 7
          fi

          if [ "$(printf '%s' "$PII_JSON" | jq -r '.success // false')" != "true" ]; then
            echo "Failed to obtain final PII pre-restore bookmark." >&2
            exit 7
          fi

          MAIN_CURRENT="$(printf '%s' "$MAIN_JSON" | jq -r '.result.bookmark // empty')"
          PII_CURRENT="$(printf '%s' "$PII_JSON" | jq -r '.result.bookmark // empty')"

          if [ -z "$MAIN_CURRENT" ] || [ -z "$PII_CURRENT" ]; then
            echo "Final pre-restore bookmark is empty." >&2
            exit 7
          fi

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                main_pre_restore_bookmark = '$MAIN_CURRENT',
                pii_pre_restore_bookmark = '$PII_CURRENT',
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID
                AND status = 'running';
            "

          echo "main_pre_restore_bookmark=$MAIN_CURRENT" >> "$GITHUB_OUTPUT"
          echo "pii_pre_restore_bookmark=$PII_CURRENT" >> "$GITHUB_OUTPUT"

      - name: Restore Main D1 to target bookmark
        id: restore_main
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          TARGET_BOOKMARK="${{ steps.journal.outputs.main_target_bookmark }}"

          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${MAIN_D1_DATABASE_ID}/time_travel/restore?bookmark=${TARGET_BOOKMARK}"

          RESPONSE="$(
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$URL"
          )"

          if [ "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" != "true" ]; then
            echo "Main D1 restore API returned unsuccessful response." >&2
            printf '%s\n' "$RESPONSE" | jq '{success, errors, messages}' >&2
            exit 10
          fi

          RESTORE_BOOKMARK="$(printf '%s' "$RESPONSE" | jq -r '.result.bookmark // empty')"
          PREVIOUS_BOOKMARK="$(printf '%s' "$RESPONSE" | jq -r '.result.previous_bookmark // empty')"

          if [ -z "$RESTORE_BOOKMARK" ] || [ -z "$PREVIOUS_BOOKMARK" ]; then
            echo "Main restore response is missing bookmark data." >&2
            exit 10
          fi

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                main_restore_status = 'success',
                main_restore_bookmark = '$RESTORE_BOOKMARK',
                main_previous_bookmark = '$PREVIOUS_BOOKMARK',
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID;
            "

          echo "main_restore_bookmark=$RESTORE_BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "main_previous_bookmark=$PREVIOUS_BOOKMARK" >> "$GITHUB_OUTPUT"

      - name: Restore PII D1 to target bookmark
        id: restore_pii
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          TARGET_BOOKMARK="${{ steps.journal.outputs.pii_target_bookmark }}"

          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PII_D1_DATABASE_ID}/time_travel/restore?bookmark=${TARGET_BOOKMARK}"

          RESPONSE="$(
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$URL"
          )"

          if [ "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" != "true" ]; then
            echo "PII D1 restore API returned unsuccessful response." >&2
            printf '%s\n' "$RESPONSE" | jq '{success, errors, messages}' >&2
            exit 11
          fi

          RESTORE_BOOKMARK="$(printf '%s' "$RESPONSE" | jq -r '.result.bookmark // empty')"
          PREVIOUS_BOOKMARK="$(printf '%s' "$RESPONSE" | jq -r '.result.previous_bookmark // empty')"

          if [ -z "$RESTORE_BOOKMARK" ] || [ -z "$PREVIOUS_BOOKMARK" ]; then
            echo "PII restore response is missing bookmark data." >&2
            exit 11
          fi

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                pii_restore_status = 'success',
                pii_restore_bookmark = '$RESTORE_BOOKMARK',
                pii_previous_bookmark = '$PREVIOUS_BOOKMARK',
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID;
            "

          echo "pii_restore_bookmark=$RESTORE_BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "pii_previous_bookmark=$PREVIOUS_BOOKMARK" >> "$GITHUB_OUTPUT"

      - name: Recreate current restore control-plane schema
        id: schema
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_FILE="migrations/restore-control-plane-schema.sql"

          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "Restore control-plane migration file is missing." >&2
            exit 12
          fi

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
            --remote \
            --file "$MIGRATION_FILE"

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$MAIN_DB" \
              --remote \
              --json \
              --command "
                SELECT COUNT(*) AS restore_table_count
                FROM sqlite_schema
                WHERE type = 'table'
                  AND name IN (
                    'restore_requests',
                    'restore_validations',
                    'restore_offsite_checks',
                    'restore_readiness',
                    'restore_execution_arms',
                    'restore_executions'
                  );
              "
          )"

          RESTORE_TABLE_COUNT="$(
            printf '%s' "$RAW" | jq -r '
              if type == "array" then
                .[0].results[0].restore_table_count // 0
              else
                .results[0].restore_table_count // 0
              end
            '
          )"

          if [ "$RESTORE_TABLE_COUNT" != "6" ]; then
            echo "Restore control-plane schema is incomplete: ${RESTORE_TABLE_COUNT}/6 tables." >&2
            exit 12
          fi

          echo "restore_schema_ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify post-restore database readability
        id: integrity
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"

          run_scalar() {
            local db_name="$1"
            local sql="$2"
            local field="$3"

            RAW="$(
              npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$db_name" \
                --remote \
                --json \
                --command "$sql"
            )"

            printf '%s' "$RAW" | jq -r --arg field "$field" '
              if type == "array" then
                .[0].results[0][$field] // empty
              else
                .results[0][$field] // empty
              end
            '
          }

          MAIN_USER_COUNT="$(
            run_scalar \
              "$MAIN_DB" \
              "SELECT COUNT(*) AS row_count FROM users;" \
              "row_count"
          )"

          PII_USER_COUNT="$(
            run_scalar \
              "$PII_DB" \
              "SELECT COUNT(*) AS row_count FROM user_pii;" \
              "row_count"
          )"

          MAIN_RESTORE_TABLE_COUNT="$(
            run_scalar \
              "$MAIN_DB" \
              "SELECT COUNT(*) AS table_count
               FROM sqlite_schema
               WHERE type = 'table'
                 AND name IN (
                   'restore_requests',
                   'restore_validations',
                   'restore_offsite_checks',
                   'restore_readiness',
                   'restore_execution_arms',
                   'restore_executions'
                 );" \
              "table_count"
          )"

          if ! [[ "$MAIN_USER_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Main D1 users table is not readable." >&2
            exit 13
          fi

          if ! [[ "$PII_USER_COUNT" =~ ^[0-9]+$ ]]; then
            echo "PII D1 user_pii table is not readable." >&2
            exit 13
          fi

          if [ "$MAIN_RESTORE_TABLE_COUNT" != "6" ]; then
            echo "Main restore control-plane schema is incomplete." >&2
            exit 13
          fi

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                main_post_integrity = 'd1_read_verified',
                pii_post_integrity = 'd1_read_verified',
                status = 'success',
                rollback_status = 'not_required',
                failure_code = NULL,
                completed_at = '$NOW_ISO',
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID;
            "

          echo "main_integrity=d1_read_verified" >> "$GITHUB_OUTPUT"
          echo "pii_integrity=d1_read_verified" >> "$GITHUB_OUTPUT"
          echo "main_user_count=$MAIN_USER_COUNT" >> "$GITHUB_OUTPUT"
          echo "pii_user_count=$PII_USER_COUNT" >> "$GITHUB_OUTPUT"
          echo "restore_table_count=$MAIN_RESTORE_TABLE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Mark interrupted or partial restore as rollback required
        if: failure() && steps.claim.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          EXECUTION_ID="${{ inputs.restore_execution_id }}"
          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          RAW="$(
            npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
              --remote \
              --json \
              --command "
                SELECT
                  main_restore_status,
                  pii_restore_status,
                  failure_code
                FROM restore_execution_journal
                WHERE restore_execution_id = $EXECUTION_ID
                LIMIT 1;
              "
          )" || true

          MAIN_STATUS="$(
            printf '%s' "$RAW" | jq -r '
              if type == "array" then
                .[0].results[0].main_restore_status // ""
              else
                .results[0].main_restore_status // ""
              end
            ' 2>/dev/null || true
          )"

          PII_STATUS="$(
            printf '%s' "$RAW" | jq -r '
              if type == "array" then
                .[0].results[0].pii_restore_status // ""
              else
                .results[0].pii_restore_status // ""
              end
            ' 2>/dev/null || true
          )"

          if [ "$MAIN_STATUS" = "success" ] || [ "$PII_STATUS" = "success" ]; then
            FINAL_STATUS="rollback_required"
            ROLLBACK_STATUS="required"
            FAILURE_CODE="PARTIAL_OR_POST_RESTORE_FAILURE"
          else
            FINAL_STATUS="failed"
            ROLLBACK_STATUS="not_required"
            FAILURE_CODE="CONTROLLED_RESTORE_PRE_DESTRUCTIVE_FAILURE"
          fi

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$OPS_DB" \
            --remote \
            --command "
              UPDATE restore_execution_journal
              SET
                status = '$FINAL_STATUS',
                rollback_status = '$ROLLBACK_STATUS',
                failure_code =
                  COALESCE(failure_code, '$FAILURE_CODE'),
                completed_at = '$NOW_ISO',
                updated_at = '$NOW_ISO'
              WHERE restore_execution_id = $EXECUTION_ID;
            " || true

          echo "Maintenance mode intentionally remains enabled."

      - name: Write restore summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MVX Actual Controlled D1 Restore"
            echo
            echo "- Restore execution: ${{ inputs.restore_execution_id }}"
            echo "- Actual restore GitHub run ID: $GITHUB_RUN_ID"
            echo "- Confirmation accepted: ${{ steps.confirm.outputs.confirmed || 'false' }}"
            echo "- Execution journal claimed: ${{ steps.claim.outcome == 'success' && 'yes' || 'no' }}"
            echo "- Archive reference: ${{ steps.journal.outputs.archive_name || 'not-resolved' }}"
            echo "- Target timestamp: ${{ steps.journal.outputs.target_timestamp || 'not-resolved' }}"
            echo "- Maintenance lock enabled: ${{ steps.maintenance.outputs.enabled || 'false' }}"
            echo "- Main D1 restore attempted: ${{ steps.restore_main.outcome != 'skipped' && 'yes' || 'no' }}"
            echo "- PII D1 restore attempted: ${{ steps.restore_pii.outcome != 'skipped' && 'yes' || 'no' }}"
            echo "- Restore control-plane schema recreated: ${{ steps.schema.outputs.restore_schema_ready || 'false' }}"
            echo "- Main post-restore verification: ${{ steps.integrity.outputs.main_integrity || 'not-verified' }}"
            echo "- PII post-restore verification: ${{ steps.integrity.outputs.pii_integrity || 'not-verified' }}"
            echo "- Main users readable: ${{ steps.integrity.outputs.main_user_count || 'not-verified' }}"
            echo "- PII records readable: ${{ steps.integrity.outputs.pii_user_count || 'not-verified' }}"
            echo "- Restore tables present: ${{ steps.integrity.outputs.restore_table_count || 'not-verified' }}/6"
            echo "- Maintenance automatically disabled: no"
            echo "- Automatic rollback performed: no"
            echo
            if [ "${{ steps.maintenance.outputs.enabled || 'false' }}" = "true" ]; then
              echo "Maintenance remains enabled for manual production verification."
            else
              echo "Maintenance was not enabled by this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
