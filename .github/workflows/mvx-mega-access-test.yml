name: MVX MEGA Access Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mega:
    runs-on: ubuntu-22.04

    env:
      MEGA_SESSION: ${{ secrets.MEGA_SESSION }}

    steps:
      - name: Install MEGAcmd
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb             -o /tmp/megacmd.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/megacmd.deb
          mega-version

      - name: Check MEGA session
        shell: bash
        run: |
          set -euo pipefail
          mega-login "$MEGA_SESSION"
          mega-whoami
          mega-ls /MVX-Backups
