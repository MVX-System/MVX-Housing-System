name: MVX Backup Access Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cloudflare:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check D1 access
        run: |
          npx --yes wrangler@4.126.0 d1 list

      - name: Check R2 read access
        run: |
          npx --yes wrangler@4.126.0 r2 bucket info mvx-water-meter-certificates
